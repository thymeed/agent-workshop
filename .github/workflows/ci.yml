name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Mask privacy words
        shell: bash
        env:
          PRIVACY_WORDS: ${{ secrets.PRIVACY_WORDS }}
        run: |
          short=0
          IFS=',' read -ra words <<< "$PRIVACY_WORDS"
          for word in "${words[@]}"; do
            word="${word#"${word%%[![:space:]]*}"}"
            word="${word%"${word##*[![:space:]]}"}"
            [ -n "$word" ] || continue
            printf '::add-mask::%s\n' "$word"
            [ "${#word}" -ge 3 ] || short=1
          done
          if [ "$short" -eq 1 ]; then
            printf '::warning::a privacy word shorter than 3 chars cannot be masked\n'
          fi
          exit 0

      - name: Smoke tests
        run: npm test
        env:
          PRIVACY_WORDS: ${{ secrets.PRIVACY_WORDS }}

      - name: Packaging check
        run: npm run build:check

      - name: Package unpacked app
        run: npm run pack:dir
